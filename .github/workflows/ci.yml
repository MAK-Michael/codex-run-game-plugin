name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sunskip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/sunskip/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify source and build
        run: npm run verify

      - name: Confirm committed build is current
        run: git diff --exit-code -- dist
